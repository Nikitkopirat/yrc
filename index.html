<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>YRCOIN</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
body{background:#0b0d17;color:#fff;padding:14px 14px 80px;user-select:none}
.bal{text-align:center;font-size:42px;font-weight:900;color:#ffcc33;margin:10px 0}
.rank{text-align:center;font-size:13px;color:#aaa;margin-bottom:14px}
.card{background:#161a2b;border:1px solid #332b14;border-radius:16px;padding:14px;margin-bottom:10px}
.coin{width:180px;height:180px;border-radius:50%;background:radial-gradient(#ffe066,#cc7a00);border:5px solid #fff099;margin:10px auto;display:flex;align-items:center;justify-content:center;font-size:74px;cursor:pointer}
.coin:active{transform:scale(0.92)}
.nav{position:fixed;bottom:10px;left:10px;right:10px;display:flex;gap:5px;background:#161a2b;padding:6px;border-radius:14px;border:1px solid #332b14}
.tab{flex:1;padding:10px 4px;border:none;background:transparent;color:#999;font-weight:700;border-radius:10px;font-size:12px}
.tab.on{background:#ffcc33;color:#000}
.sec{display:none}.sec.on{display:block}
.btn{background:#ffcc33;color:#000;border:none;padding:10px 14px;border-radius:10px;font-weight:800;font-size:13px;width:100%;margin-top:6px}
.btn:disabled{background:#2a2e42;color:#777}
canvas{display:block;margin:10px auto;border-radius:50%;border:4px solid #ffcc33;transition:transform 4s cubic-bezier(.17,.67,.12,.99)}
</style>
</head>
<body>
<div class="bal"><span id="sc">0</span> 🪓</div>
<div class="rank">Ранг: <b id="rk" style="color:#ffcc33">Турист на Стрелке</b> | Энергия: <b id="en">100</b>⚡</div>

<div id="s1" class="sec on">
<div class="card"><div class="coin" onclick="tap()">🐻</div><p style="text-align:center;font-size:12px;color:#aaa">Жми на медведя (+<span id="pw">1</span> 🪓 за тап)</p></div>
</div>

<div id="s2" class="sec">
<div class="card" style="text-align:center"><b>🎡 Колесо Районов Ярославля</b><canvas id="wh" width="240" height="240"></canvas><button class="btn" id="spb" onclick="spin()">Крутить (100 🪓 или 1 раз бесплатно)</button></div>
</div>

<div id="s3" class="sec">
<div class="card"><b>🪓 Острая Секира (+1 за тап)</b><button class="btn" id="u1" onclick="buy(1)">Купить (50 🪓)</button></div>
<div class="card"><b>📢 Подписаться на @yarcoin76</b><button class="btn" id="t1" onclick="task('t1',150)">Забрать +150 🪓</button></div>
<div class="card"><b>🔥 Реакция на пост в канале</b><button class="btn" id="t2" onclick="task('t2',100)">Забрать +100 🪓</button></div>
</div>

<div class="nav">
<button class="tab on" onclick="go('s1',this)">🐻 Тап</button>
<button class="tab" onclick="go('s2',this)">🎡 Колесо</button>
<button class="tab" onclick="go('s3',this)">⚡ Прокачка</button>
</div>

<script>
let d=JSON.parse(localStorage.getItem('yrc3')||'{"s":0,"p":1,"e":100,"t":{}}');
const secs=[{n:"Центр",v:250,c:"#f5b942"},{n:"Брагино",v:100,c:"#2b5876"},{n:"Заволга",v:150,c:"#00b09b"},{n:"Перекоп",v:80,c:"#8e44ad"},{n:"Фрунзе",v:120,c:"#e67e22"},{n:"Стрелка",v:300,c:"#00e676"}];
function save(){localStorage.setItem('yrc3',JSON.stringify(d));ui();}
function ui(){
document.getElementById('sc').innerText=d.s;
document.getElementById('pw').innerText=d.p;
document.getElementById('en').innerText=d.e;
document.getElementById('rk').innerText=d.s>=1000?"Легенда Ярославля 🐻":d.s>=300?"Ярославский Купец":"Турист на Стрелке";
if(d.t.t1){let b=document.getElementById('t1');b.innerText="Готово ✓";b.disabled=true;}
if(d.t.t2){let b=document.getElementById('t2');b.innerText="Готово ✓";b.disabled=true;}
}
function go(id,el){document.querySelectorAll('.sec').forEach(x=>x.classList.remove('on'));document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');el.classList.add('on');}
function tap(){if(d.e<=0)return;d.e--;d.s+=d.p;save();}
setInterval(()=>{if(d.e<100){d.e++;save();}},1500);
function buy(n){if(d.s<50)return alert("Нужно 50 🪓");d.s-=50;d.p+=1;save();}
function task(k,v){if(d.t[k])return;window.open('https://'+'t.me/'+'yarcoin76','_blank');d.t[k]=1;d.s+=v;save();}
const c=document.getElementById('wh').getContext('2d');let deg=0,sp=0;
secs.forEach((x,i)=>{let a=i*Math.PI/3;c.beginPath();c.fillStyle=x.c;c.moveTo(120,120);c.arc(120,120,115,a,a+Math.PI/3);c.fill();c.save();c.translate(120,120);c.rotate(a+Math.PI/6);c.fillStyle="#fff";c.font="bold 12px sans-serif";c.fillText(x.n+" +"+x.v,35,4);c.restore();});
function spin(){if(sp)return;let td=new Date().toDateString();if(d.sp===td){if(d.s<100)return alert("Нужно 100 🪓");d.s-=100;}else d.sp=td;sp=1;let w=Math.floor(Math.random()*6);deg+=1800+(270-(w*60+30))-(deg%360);document.getElementById('wh').style.transform="rotate("+deg+"deg)";setTimeout(()=>{sp=0;d.s+=secs[w].v;save();alert("Район "+secs[w].n+": +"+secs[w].v+" 🪓!");},4100);}
ui();
</script>
</body>
</html>
